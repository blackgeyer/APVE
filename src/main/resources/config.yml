# Must be configured to your punishment plugin syntax
punishments:
  mute-command: mute %player% %duration% %reason%
  ban-command: ban %player% %duration% %reason%
  banip-command: banip %ip% %duration% %reason%
  kick-command: kick %player% %reason%
  
  punishments-is-enabled: true
  
  # If true, APVE will automatically set aproppiate command syntax automaticaly based on the installed punishment plugin.
  auto-detect-plugin: true
  
  perm-keywords:
  - permanent
  - perm
  - infinity
  - inf
  - '-1'

priority:
  caps: 1
  spam: 2
  insult: 3
  adult-content: 4
  family-insult: 5
  staff-insult: 6
  soc-media-dist: 7
  ad-dist: 8

# If true, the plugin will not apply any warn/censor/blocking etc. to the violators. Plugin will only log every violate. 
# This mode is incompatible with punishments and warns. Consequently, if you enable this mode with another auctions, A.P.V.E's work will aborted.
audit-mode: false

# If false, APVE will not send messages about player's violations to the console.
console-log: false

# If true, APVE will send notifies about player's violations in game to the player's, which has apve.violation.notify permission.
notifies: true


# If there are no message keys below this note, don't worry, plugin will generate this keys from selected localization after a first server start after putting APVE jar file into the plugins directory.

warns:
  warn-limit: 2
  warn-limit-is-enabled: true
  
  warn_reset_when_server_restarts: true
  temporary-warns: true
  warn-reset-time: 1h
  warn_reset_count: 2
  warns-is-enabled: true

insult:
  is-enabled: true
  punishment-is-enabled: true
  duration: 30m
  type: mute
  blocking: true
  censor: false

family-insult:
  is-enabled: true
  punishment-is-enabled: true
  duration: 8h
  type: mute
  blocking: true
  censor: false

ad-dist:
  is-enabled: true
  punishment-is-enabled: true
  duration: 30d
  type: banip
  blocking: true
  censor: false

soc-media-dist:
  is-enabled: true
  punishment-is-enabled: true
  duration: 180m
  type: ban
  blocking: true
  censor: false

adult-content:
  is-enabled: true
  punishment-is-enabled: true
  type: mute
  duration: 8h
  blocking: true
  censor: false

staff-insult:
  is-enabled: true
  punishment-is-enabled: true
  type: mute
  duration: 12h
  blocking: true
  censor: false

spam:
  is-enabled: true
  punishment-is-enabled: true
  max-similar-messages: 3
  time-window-seconds: 60
  similarity-threshold: 0.9
  type: mute
  duration: 20m
  blocking: false

caps:
  is-enabled: true
  punishment-is-enabled: false
  min-message-length: 6
  min-caps-percentage: 70
  type: mute
  duration: 15m
  blocking: false
  censor: false

